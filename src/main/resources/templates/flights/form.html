<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programar vuelo | SkyRegister</title><link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow-container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="page-heading"><div><p class="eyebrow">OPERACIONES</p><h1>Programar vuelo</h1><p class="muted">Asigna un dron disponible e indica los detalles de la misión.</p></div></section>
    <section class="content-card form-card">
        <form th:action="@{/flights}" th:object="${flight}" method="post" class="app-form">
            <div class="form-grid">
                <div class="field full-width"><label for="droneId">Dron asignado *</label><select id="droneId" th:field="*{droneId}" required="required"><option value="">Selecciona un dron</option><option th:each="drone : ${drones}" th:value="${drone.id}" th:text="|${drone.name} — ${drone.model}|">Aquila 01</option></select><small class="field-error" th:if="${#fields.hasErrors('droneId')}" th:errors="*{droneId}"></small><small class="field-help" th:if="${#lists.isEmpty(drones)}">No hay drones disponibles. Registra o habilita un dron antes de continuar.</small></div>
                <div class="field"><label for="origin">Origen *</label><input id="origin" type="text" th:field="*{origin}" placeholder="Base central" maxlength="150" required="required" /><small class="field-error" th:if="${#fields.hasErrors('origin')}" th:errors="*{origin}"></small></div>
                <div class="field"><label for="destination">Destino *</label><input id="destination" type="text" th:field="*{destination}" placeholder="Zona norte" maxlength="150" required="required" /><small class="field-error" th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}"></small></div>
                <div class="field"><label for="scheduledAt">Fecha y hora *</label><input id="scheduledAt" type="datetime-local" th:field="*{scheduledAt}" required="required" /><small class="field-error" th:if="${#fields.hasErrors('scheduledAt')}" th:errors="*{scheduledAt}"></small></div>
                <div class="field"><label for="durationMinutes">Duración estimada (minutos) *</label><input id="durationMinutes" type="number" th:field="*{durationMinutes}" min="1" placeholder="45" required="required" /><small class="field-error" th:if="${#fields.hasErrors('durationMinutes')}" th:errors="*{durationMinutes}"></small></div>
                <div class="field"><label for="status">Estado *</label><select id="status" th:field="*{status}" required="required"><option value="Programado">Programado</option><option value="En curso">En curso</option><option value="Completado">Completado</option><option value="Cancelado">Cancelado</option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
                <div class="field full-width"><label for="notes">Notas de la misión</label><textarea id="notes" th:field="*{notes}" rows="3" maxlength="500" placeholder="Objetivo, observaciones o instrucciones especiales"></textarea><small class="field-error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></small></div>
            </div>
            <div class="form-actions"><a class="button secondary" th:href="@{/flights}">Cancelar</a><button class="button primary" type="submit" th:disabled="${#lists.isEmpty(drones)}">Guardar vuelo</button></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
