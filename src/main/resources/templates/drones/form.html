<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} + ' | SkyRegister'">Dron | SkyRegister</title><link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow-container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="page-heading"><div><p class="eyebrow">INVENTARIO</p><h1 th:text="${pageTitle}">Registrar dron</h1><p class="muted">Completa los datos del equipo. Los campos marcados son obligatorios.</p></div></section>
    <section class="content-card form-card">
        <form th:action="${formAction}" th:object="${drone}" method="post" class="app-form">
            <div class="form-grid">
                <div class="field"><label for="name">Nombre del dron *</label><input id="name" type="text" th:field="*{name}" placeholder="Ej. Águila 04" maxlength="100" required="required" /><small class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></div>
                <div class="field"><label for="model">Modelo *</label><input id="model" type="text" th:field="*{model}" placeholder="Ej. DJI Mavic 3" maxlength="100" required="required" /><small class="field-error" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></small></div>
                <div class="field"><label for="serialNumber">Número de serie *</label><input id="serialNumber" type="text" th:field="*{serialNumber}" placeholder="Ej. SR-DR-004" maxlength="80" required="required" /><small class="field-error" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></small></div>
                <div class="field"><label for="status">Estado *</label><select id="status" th:field="*{status}" required="required"><option value="Disponible">Disponible</option><option value="En mantenimiento">En mantenimiento</option><option value="Fuera de servicio">Fuera de servicio</option></select><small class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small></div>
                <div class="field"><label for="batteryLevel">Nivel de batería (%) *</label><input id="batteryLevel" type="number" th:field="*{batteryLevel}" min="0" max="100" required="required" /><small class="field-help">Valor entre 0 y 100.</small><small class="field-error" th:if="${#fields.hasErrors('batteryLevel')}" th:errors="*{batteryLevel}"></small></div>
                <div class="field"><label for="lastMaintenance">Último mantenimiento</label><input id="lastMaintenance" type="date" th:field="*{lastMaintenance}" /><small class="field-help">Campo opcional.</small></div>
            </div>
            <div class="form-actions"><a class="button secondary" th:href="@{/drones}">Cancelar</a><button class="button primary" type="submit">Guardar dron</button></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
