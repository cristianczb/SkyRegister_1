spring.application.name=SkyRegister
server.port=8080

# La base de datos H2 se guarda en la carpeta data del proyecto.
spring.datasource.url=jdbc:h2:file:./data/skyregister;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Crea las tablas y carga registros de ejemplo al iniciar.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola local de consulta de H2 (solo para desarrollo).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Facilita ver los cambios de las plantillas durante el desarrollo.
spring.thymeleaf.cache=false
